name: Provision astyle
description: >
  astyle for generated-code formatting, cache-first: warm cells restore the
  pinned binary and never touch the network; a cold cell acquires it via
  chocolatey (retried), stages it under C:\deps\astyle, and saves the cache.
  Fails here, loudly, rather than later inside codegen.

inputs:
  version:
    description: Pinned astyle version
    default: '3.6.2'

runs:
  using: composite
  steps:
    - name: Restore astyle from cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: C:\deps\astyle\astyle.exe
        key: astyle-win-${{ inputs.version }}

    - name: Acquire astyle ${{ inputs.version }} (cold cell)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($attempt in 1..3) {
          choco install astyle --version ${{ inputs.version }} -y --no-progress
          if ($LASTEXITCODE -eq 0) { break }
          if ($attempt -eq 3) { throw "choco install astyle ${{ inputs.version }} failed after 3 attempts (exit $LASTEXITCODE)" }
          Write-Warning "choco install astyle attempt $attempt failed (exit $LASTEXITCODE); retrying in $(20 * $attempt)s"
          Start-Sleep -Seconds (20 * $attempt)
        }
        $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\astyle -Recurse -Filter astyle.exe | Select-Object -First 1
        if (-not $exe) { throw "astyle.exe not found under C:\ProgramData\chocolatey\lib\astyle" }
        New-Item -ItemType Directory -Force C:\deps\astyle | Out-Null
        Copy-Item $exe.FullName C:\deps\astyle\astyle.exe -Force

    - name: Put astyle on PATH and verify it runs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        Add-Content $env:GITHUB_PATH 'C:\deps\astyle'
        & C:\deps\astyle\astyle.exe --version
        if ($LASTEXITCODE -ne 0) { throw "astyle failed to run (exit $LASTEXITCODE)" }

    - name: Save astyle to cache (only a verified binary)
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\deps\astyle\astyle.exe
        key: astyle-win-${{ inputs.version }}
