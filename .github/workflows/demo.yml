name: family-demo

# The 60-second demo, kept honest: builds the two demo images (the C++ engine
# with the demo Design baked in; one Python image carrying kilonova + hypernova
# at pinned commits), publishes them to ghcr, then runs demo/verify.sh — the
# same compose a user runs — and asserts live values within the 60 s budget.
# No pull_request trigger by deliberate choice: this repo works master-direct
# (review-then-merge, no PR ceremony), so the gate fires on the push that lands
# the change — a red here means fix-forward, same as every other lane.
on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The C++ engine image compiles natively per arch (amd64 + arm64 runners,
  # each FROM its own quasar-ci builder), then the merge job stitches the two
  # per-arch tags into one multi-arch :supernova tag.
  supernova-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest,    base_suffix: '' }
          - { arch: arm64, runner: ubuntu-24.04-arm, base_suffix: '-arm64' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile.supernova
          push: true
          build-args: |
            BASE_ARCH_SUFFIX=${{ matrix.base_suffix }}
          tags: ghcr.io/${{ github.repository_owner }}/quasarnova-demo:supernova-${{ matrix.arch }}
          cache-from: type=gha,scope=demo-supernova-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demo-supernova-${{ matrix.arch }}

  # Pure-python image: one buildx invocation, QEMU for the arm64 layer.
  python-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile.python
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/quasarnova-demo:python
          cache-from: type=gha,scope=demo-python
          cache-to: type=gha,mode=max,scope=demo-python

  merge:
    needs: [supernova-image, python-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository_owner }}/quasarnova-demo:supernova \
            ghcr.io/${{ github.repository_owner }}/quasarnova-demo:supernova-amd64 \
            ghcr.io/${{ github.repository_owner }}/quasarnova-demo:supernova-arm64

  verify:
    needs: merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f demo/compose.yaml pull
      - run: ./demo/verify.sh

  # Advisory: records the demo as asciinema cast + GIF artifacts. Never gates.
  record:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f demo/compose.yaml pull
      - run: pipx install asciinema
      - run: |
          cd demo
          asciinema rec demo.cast --overwrite -c \
            "bash -c 'docker compose up -d >/dev/null 2>&1; timeout 25 docker compose logs -f subscriber | head -40 || true; docker compose down -v >/dev/null 2>&1'"
      - run: |
          curl -fsSL -o /tmp/agg https://github.com/asciinema/agg/releases/download/v1.5.0/agg-x86_64-unknown-linux-gnu
          chmod +x /tmp/agg
          /tmp/agg demo/demo.cast demo/demo.gif
      - uses: actions/upload-artifact@v4
        with:
          name: demo-recording
          path: |
            demo/demo.cast
            demo/demo.gif
