name: family-demo

# The 60-second demo, kept honest: builds the two demo images (the C++ engine
# with the demo Design baked in; one Python image carrying kilonova + hypernova
# at pinned commits), publishes them to ghcr, then runs demo/verify.sh — the
# same compose a user runs — and asserts live values within the 60 s budget.
on:
  push:
    branches: [master]
    paths:
      - 'demo/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: supernova, dockerfile: demo/Dockerfile.supernova }
          - { tag: python,    dockerfile: demo/Dockerfile.python }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quasarnova-demo:${{ matrix.tag }}
          cache-from: type=gha,scope=demo-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.tag }}

  verify:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose -f demo/compose.yaml pull
      - run: ./demo/verify.sh
